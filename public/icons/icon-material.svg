<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Material Shadows -->
    <filter id="matShadowElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
    <filter id="burgerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>

    <!-- Material Emerald Gradient -->
    <linearGradient id="matEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>

    <!-- Material Bun Gradient -->
    <linearGradient id="matBunTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#matEmerald)"/>

  <!-- Material Scale Card -->
  <g filter="url(#matShadowElevation)">
    <!-- Scale base plate -->
    <rect x="96" y="330" width="320" height="90" rx="32" fill="#FFFFFF"/>
    <!-- Scale Display -->
    <rect x="180" y="352" width="152" height="46" rx="14" fill="#004D40"/>
    <text x="256" y="385" font-family="'Roboto', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#69F0AE" text-anchor="middle" letter-spacing="2">180 g</text>
  </g>

  <!-- Scale Platform -->
  <ellipse cx="256" cy="300" rx="170" ry="28" fill="#ECEFF1"/>
  <ellipse cx="256" cy="296" rx="160" ry="24" fill="#FAFAFA"/>

  <!-- BURGER GROUP (Material 3 Flat & Vivid) -->
  <g filter="url(#burgerShadow)">
    <!-- Bottom Bun -->
    <path d="M 146 264 C 146 280, 366 280, 366 264 Z" fill="#FFA000"/>
    <rect x="146" y="254" width="220" height="14" rx="7" fill="#FFB300"/>

    <!-- Grilled Patty -->
    <rect x="130" y="222" width="252" height="34" rx="17" fill="#4E342E"/>

    <!-- Melted Cheddar Drop -->
    <path d="M 134 226 L 378 226 L 360 248 L 310 242 L 290 262 L 256 244 L 210 260 L 190 242 L 148 250 Z" fill="#FFD54F"/>

    <!-- Tomato Slices -->
    <rect x="140" y="196" width="232" height="26" rx="13" fill="#D32F2F"/>
    <ellipse cx="196" cy="209" rx="36" ry="7" fill="#E53935"/>
    <ellipse cx="316" cy="209" rx="36" ry="7" fill="#E53935"/>

    <!-- Wavy Fresh Lettuce -->
    <path d="M 120 190 C 138 174, 160 198, 184 182 C 208 166, 232 198, 256 180 C 280 164, 304 196, 328 180 C 352 164, 374 192, 392 188 C 392 200, 120 200, 120 190 Z" fill="#43A047"/>

    <!-- Top Gourmet Bun Dome -->
    <path d="M 136 182 C 136 86, 376 86, 376 182 Z" fill="url(#matBunTop)"/>
    
    <!-- Sesame Seeds -->
    <ellipse cx="200" cy="138" rx="4" ry="8" transform="rotate(25, 200, 138)" fill="#FFF9C4"/>
    <ellipse cx="256" cy="118" rx="4" ry="8" transform="rotate(-8, 256, 118)" fill="#FFF9C4"/>
    <ellipse cx="312" cy="134" rx="4" ry="8" transform="rotate(-28, 312, 134)" fill="#FFF9C4"/>
    <ellipse cx="236" cy="154" rx="4" ry="8" transform="rotate(18, 236, 154)" fill="#FFF9C4"/>
    <ellipse cx="286" cy="158" rx="4" ry="8" transform="rotate(38, 286, 158)" fill="#FFF9C4"/>
    <ellipse cx="174" cy="156" rx="4" ry="8" transform="rotate(-15, 174, 156)" fill="#FFF9C4"/>
    <ellipse cx="340" cy="156" rx="4" ry="8" transform="rotate(12, 340, 156)" fill="#FFF9C4"/>
  </g>
</svg>