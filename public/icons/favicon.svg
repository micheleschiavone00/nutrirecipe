<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="favScale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="favAvo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)"/>

  <!-- Scale Shadow -->
  <ellipse cx="64" cy="104" rx="42" ry="7" fill="#022c22" opacity="0.35"/>

  <!-- Kitchen Scale Base -->
  <rect x="26" y="80" width="76" height="24" rx="8" fill="url(#favScale)" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Scale LCD Screen -->
  <rect x="46" y="88" width="36" height="11" rx="3" fill="#064e3b"/>
  <text x="64" y="96.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="900" fill="#34d399" text-anchor="middle">200g</text>

  <!-- Scale Weighing Plate -->
  <ellipse cx="64" cy="72" rx="40" ry="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Food: Bowl with Avocado & Tomato -->
  <!-- White Ceramic Bowl -->
  <path d="M 36 58 C 36 80 92 80 92 58 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <ellipse cx="64" cy="58" rx="28" ry="6" fill="#f1f5f9"/>

  <!-- Fresh Greens -->
  <path d="M 46 56 C 40 45 52 36 60 44 C 64 48 60 55 46 56 Z" fill="#22c55e"/>
  <path d="M 70 56 C 68 38 85 34 88 44 C 90 50 82 56 70 56 Z" fill="#4ade80"/>

  <!-- Avocado Half -->
  <g transform="translate(52, 42) rotate(-8)">
    <ellipse cx="10" cy="13" rx="10" ry="14" fill="#14532d"/>
    <ellipse cx="10" cy="13" rx="8.5" ry="12.5" fill="url(#favAvo)"/>
    <ellipse cx="10" cy="15" rx="4.5" ry="6" fill="#78350f"/>
  </g>

  <!-- Cherry Tomato -->
  <circle cx="78" cy="56" r="6.5" fill="#ef4444"/>
  <circle cx="76" cy="54" r="1.5" fill="#ffffff" opacity="0.6"/>
  <path d="M 78 49 L 78 51 M 76 50 L 80 50" stroke="#15803d" stroke-width="1" stroke-linecap="round"/>
</svg>
