<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Matte Scale Body Gradient -->
    <linearGradient id="darkScale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Bun Gradient -->
    <linearGradient id="darkBunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Patty Gradient -->
    <linearGradient id="darkPattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b3012"/>
      <stop offset="100%" stop-color="#2d1205"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with subtle emerald border -->
  <rect width="128" height="128" rx="28" fill="url(#darkBg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Subtle Scale Shadow -->
  <ellipse cx="64" cy="106" rx="42" ry="6" fill="#000000" opacity="0.8"/>

  <!-- Scale Body (Dark Matte Titanium) -->
  <rect x="24" y="82" width="80" height="22" rx="8" fill="url(#darkScale)" stroke="#4b5563" stroke-width="1.2"/>
  
  <!-- Scale LCD Display with Neon Emerald Glow -->
  <rect x="44" y="87" width="40" height="13" rx="3" fill="#022c22" stroke="#059669" stroke-width="0.8"/>
  <text x="64" y="96.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="0.5" filter="url(#emeraldGlow)">180g</text>

  <!-- Scale Weighing Dark Glass Surface -->
  <ellipse cx="64" cy="74" rx="42" ry="7" fill="#1f2937" stroke="#374151" stroke-width="1.2"/>
  <ellipse cx="64" cy="74" rx="38" ry="5.5" fill="#111827" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Burger Shadow on Scale -->
  <ellipse cx="64" cy="74" rx="30" ry="4" fill="#000000" opacity="0.6"/>

  <!-- BURGER LAYERS -->
  <!-- 1. Bottom Bun -->
  <rect x="36" y="66" width="56" height="8" rx="4" fill="#b45309"/>
  <rect x="37" y="67" width="54" height="6" rx="3" fill="#d97706" opacity="0.5"/>

  <!-- 2. Grilled Patty -->
  <rect x="33" y="58" width="62" height="9" rx="4.5" fill="url(#darkPattyGrad)"/>
  
  <!-- 3. Melted Cheddar Cheese -->
  <path d="M 33 59 L 95 59 L 91 64 L 78 63 L 74 67 L 66 63 L 56 67 L 50 63 L 37 65 Z" fill="#fbbf24"/>

  <!-- 4. Fresh Sliced Tomato -->
  <rect x="35" y="52" width="58" height="6.5" rx="3" fill="#dc2626"/>
  <rect x="37" y="53" width="26" height="4" rx="2" fill="#ef4444"/>
  <rect x="65" y="53" width="26" height="4" rx="2" fill="#ef4444"/>

  <!-- 5. Crisp Wavy Lettuce -->
  <path d="M 31 51 C 35 47, 41 53, 47 49 C 53 45, 59 53, 65 48 C 71 44, 77 52, 83 48 C 89 44, 93 51, 97 50 C 97 53, 31 54, 31 51 Z" fill="#16a34a"/>

  <!-- 6. Top Gourmet Bun (Dome) -->
  <path d="M 34 49 C 34 26, 94 26, 94 49 Z" fill="url(#darkBunGrad)"/>
  <!-- Highlight shine on bun -->
  <ellipse cx="50" cy="35" rx="10" ry="3.5" transform="rotate(-15, 50, 35)" fill="#fde68a" opacity="0.4"/>

  <!-- Sesame Seeds -->
  <ellipse cx="52" cy="38" rx="1" ry="2" transform="rotate(25, 52, 38)" fill="#fef3c7"/>
  <ellipse cx="64" cy="33" rx="1" ry="2" transform="rotate(-10, 64, 33)" fill="#fef3c7"/>
  <ellipse cx="76" cy="37" rx="1" ry="2" transform="rotate(-30, 76, 37)" fill="#fef3c7"/>
  <ellipse cx="60" cy="42" rx="1" ry="2" transform="rotate(15, 60, 42)" fill="#fef3c7"/>
  <ellipse cx="72" cy="43" rx="1" ry="2" transform="rotate(40, 72, 43)" fill="#fef3c7"/>
  <ellipse cx="45" cy="43" rx="1" ry="2" transform="rotate(-20, 45, 43)" fill="#fef3c7"/>
  <ellipse cx="82" cy="43" rx="1" ry="2" transform="rotate(10, 82, 43)" fill="#fef3c7"/>
</svg>