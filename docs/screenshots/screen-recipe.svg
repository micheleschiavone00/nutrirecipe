<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="100%" height="100%">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Phone Bezel -->
  <rect x="10" y="10" width="360" height="740" rx="44" fill="#0f172a" filter="url(#phoneShadow)" />
  <rect x="18" y="18" width="344" height="724" rx="36" fill="#f8fafc" />

  <!-- Dynamic Island -->
  <rect x="130" y="26" width="120" height="26" rx="13" fill="#0f172a" />
  
  <!-- Status Bar time / icons -->
  <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">9:41</text>
  <text x="325" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">100% 􀛨</text>

  <!-- Top Hero Header Image -->
  <rect x="18" y="60" width="344" height="150" fill="#a7f3d0" />
  <text x="190" y="150" font-family="sans-serif" font-size="64" text-anchor="middle" opacity="0.6">🥞</text>
  
  <!-- Back Button & Fav Button -->
  <circle cx="48" cy="90" r="16" fill="#ffffff" fill-opacity="0.9" />
  <text x="48" y="94" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1e293b">←</text>
  
  <circle cx="332" cy="90" r="16" fill="#ffffff" fill-opacity="0.9" />
  <text x="332" y="95" font-family="sans-serif" font-size="14" text-anchor="middle">❤️</text>

  <!-- Card Body -->
  <g transform="translate(32, 195)">
    <!-- Recipe Info Card -->
    <rect width="316" height="135" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="800" fill="#0f172a">
      Pancake Salati con Feta &amp; Zucchine
    </text>

    <!-- Badges Row -->
    <g transform="translate(16, 40)">
      <!-- Meal category pill (Dual lunch/dinner) -->
      <rect x="0" y="0" width="138" height="24" rx="12" fill="#d1fae5" stroke="#a7f3d0" />
      <text x="69" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">☀️🌙 Pranzo e Cena ▼</text>

      <rect x="146" y="0" width="62" height="24" rx="12" fill="#f1f5f9" />
      <text x="177" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">TikTok</text>

      <rect x="216" y="0" width="68" height="24" rx="12" fill="#eff6ff" />
      <text x="250" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">⏱ 15 min</text>
    </g>

    <!-- Macro Bar -->
    <g transform="translate(16, 80)">
      <rect width="284" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="36" y="26" font-family="sans-serif" font-size="13" font-weight="800" fill="#ea580c" text-anchor="middle">385 kcal</text>
      <text x="108" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">34g P</text>
      <text x="180" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">38g C</text>
      <text x="248" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">10g F</text>
    </g>
  </g>

  <!-- Tabs (Ingredienti | Preparazione) -->
  <g transform="translate(32, 344)">
    <rect width="316" height="38" rx="12" fill="#f1f5f9" />
    <rect x="160" y="3" width="152" height="32" rx="10" fill="#ffffff" filter="url(#phoneShadow)" />
    <text x="80" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">🥗 Ingredienti</text>
    <text x="236" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">👨‍🍳 Preparazione</text>
  </g>

  <!-- Step-by-Step with highlighted doses -->
  <g transform="translate(32, 396)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="316" height="105" rx="16" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="28" cy="28" r="14" fill="#10b981" />
      <text x="28" y="33" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
      
      <text x="52" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">In una ciotola unire le zucchine</text>
      <text x="52" y="46" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">(200g)</text>
      <text x="100" y="46" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">grattugiate, le uova</text>
      <text x="52" y="64" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">(1 intero, 50g)</text>
      <text x="156" y="64" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">e la feta</text>
      <text x="52" y="82" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">(25g)</text>
      <text x="88" y="82" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">sbriciolata bilanciata al 50%.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 116)">
      <rect width="316" height="90" rx="16" fill="#ffffff" stroke="#e2e8f0" />
      <circle cx="28" cy="28" r="14" fill="#10b981" />
      <text x="28" y="33" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
      
      <text x="52" y="28" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">Aggiungere la farina d'avena</text>
      <text x="52" y="46" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">(40g)</text>
      <text x="88" y="46" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">e l'olio EVO</text>
      <text x="165" y="46" font-family="sans-serif" font-size="12" font-weight="800" fill="#059669">(10g)</text>
      <text x="204" y="46" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">nel</text>
      <text x="52" y="64" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b">composto. Cuocere in padella antiaderente.</text>
    </g>
  </g>

  <!-- CTA Bottom -->
  <g transform="translate(32, 625)">
    <rect width="316" height="46" rx="14" fill="url(#primaryGrad)" />
    <text x="158" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      📅 Aggiungi al Meal Planner
    </text>
  </g>

  <!-- Home Indicator bar -->
  <rect x="120" y="730" width="140" height="4.5" rx="2.5" fill="#0f172a" />
</svg>