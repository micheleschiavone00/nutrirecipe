<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="100%" height="100%">
  <defs>
    <filter id="phoneShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <linearGradient id="primaryGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Phone Bezel -->
  <rect x="10" y="10" width="360" height="740" rx="44" fill="#0f172a" filter="url(#phoneShadow3)" />
  <rect x="18" y="18" width="344" height="724" rx="36" fill="#f8fafc" />

  <!-- Dynamic Island -->
  <rect x="130" y="26" width="120" height="26" rx="13" fill="#0f172a" />
  
  <!-- Status Bar -->
  <text x="45" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">9:41</text>
  <text x="325" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="end">100% 􀛨</text>

  <!-- App Header -->
  <g transform="translate(32, 68)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#0f172a">
      Meal Planner
    </text>

    <!-- Shopping button top right -->
    <rect x="220" y="2" width="94" height="32" rx="10" fill="url(#primaryGrad3)" />
    <text x="267" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🛒 Spesa</text>
  </g>

  <!-- Week Navigator -->
  <g transform="translate(32, 115)">
    <rect width="316" height="78" rx="16" fill="#ffffff" stroke="#e2e8f0" />
    <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">
      Settimana 26 Ott – 1 Nov
    </text>

    <!-- Day pills row -->
    <g transform="translate(10, 36)">
      <!-- Lun (active) -->
      <rect x="0" y="0" width="40" height="34" rx="10" fill="#10b981" />
      <text x="20" y="14" font-family="sans-serif" font-size="9" font-weight="600" fill="#d1fae5" text-anchor="middle">LUN</text>
      <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">26</text>

      <!-- Mar -->
      <rect x="44" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="63" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">MAR</text>
      <text x="63" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">27</text>

      <!-- Mer -->
      <rect x="86" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="105" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">MER</text>
      <text x="105" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">28</text>

      <!-- Gio -->
      <rect x="128" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="147" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">GIO</text>
      <text x="147" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">29</text>

      <!-- Ven -->
      <rect x="170" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="189" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">VEN</text>
      <text x="189" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">30</text>

      <!-- Sab -->
      <rect x="212" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="231" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">SAB</text>
      <text x="231" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">31</text>

      <!-- Dom -->
      <rect x="254" y="0" width="38" height="34" rx="10" fill="#f1f5f9" />
      <text x="273" y="14" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">DOM</text>
      <text x="273" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- Day Card (Lunedì) -->
  <g transform="translate(32, 210)">
    <rect width="316" height="420" rx="20" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    
    <!-- Day Card Header -->
    <rect width="316" height="38" rx="18" fill="#10b981" />
    <text x="16" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">📍 Lunedì 26 Ottobre (Oggi)</text>

    <!-- Slots -->
    <g transform="translate(16, 50)">
      <!-- Breakfast slot -->
      <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">🌅 Colazione</text>
      <rect x="0" y="22" width="284" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <circle cx="22" cy="45" r="9" fill="#10b981" />
      <text x="22" y="49" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="40" y="42" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#334155">Porridge Avena &amp; Frutti di Bosco</text>
      <text x="40" y="56" font-family="sans-serif" font-size="10" fill="#64748b">310 kcal</text>

      <!-- Lunch slot -->
      <g transform="translate(0, 80)">
        <div style="display:flex">
          <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">☀️ Pranzo</text>
        </div>
        <rect x="0" y="22" width="284" height="54" rx="12" fill="#ecfdf5" stroke="#a7f3d0" />
        <circle cx="22" cy="49" r="9" fill="none" stroke="#cbd5e1" stroke-width="2" />
        <text x="40" y="44" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Pancake Zucchine &amp; Feta</text>
        <text x="40" y="60" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">☀️🌙 Pranzo e Cena • 385 kcal</text>
      </g>

      <!-- Snack slot -->
      <g transform="translate(0, 168)">
        <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">🍎 Spuntino</text>
        <rect x="0" y="22" width="284" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="14" y="48" font-family="sans-serif" font-size="11" fill="#64748b">Yogurt Greco (150g) + Mandorle (15g)</text>
      </g>

      <!-- Dinner slot -->
      <g transform="translate(0, 244)">
        <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">🌙 Cena</text>
        <rect x="0" y="22" width="284" height="54" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="22" cy="49" r="9" fill="none" stroke="#cbd5e1" stroke-width="2" />
        <text x="40" y="44" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#334155">Filetto di Salmone &amp; Asparagi</text>
        <text x="40" y="60" font-family="sans-serif" font-size="10" fill="#64748b">420 kcal • 38g P</text>
      </g>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(18, 650)">
    <rect width="344" height="66" rx="20" fill="#ffffff" stroke="#e2e8f0" />
    <text x="48" y="32" font-family="sans-serif" font-size="18" text-anchor="middle">📚</text>
    <text x="48" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Ricette</text>

    <text x="115" y="32" font-family="sans-serif" font-size="18" text-anchor="middle">➕</text>
    <text x="115" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Importa</text>

    <text x="182" y="32" font-family="sans-serif" font-size="18" text-anchor="middle">📅</text>
    <text x="182" y="48" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">Piano</text>

    <text x="249" y="32" font-family="sans-serif" font-size="18" text-anchor="middle">🛒</text>
    <text x="249" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Spesa</text>

    <text x="306" y="32" font-family="sans-serif" font-size="18" text-anchor="middle">⚙️</text>
    <text x="306" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Settings</text>
  </g>

  <!-- Home Indicator bar -->
  <rect x="120" y="730" width="140" height="4.5" rx="2.5" fill="#0f172a" />
</svg>