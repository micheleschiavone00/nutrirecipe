<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle circles decoration -->
  <circle cx="1100" cy="80" r="180" fill="#10b981" opacity="0.08" />
  <circle cx="150" cy="350" r="140" fill="#34d399" opacity="0.06" />

  <!-- Main Container -->
  <g transform="translate(80, 70)">
    <!-- App Icon & Title row -->
    <g transform="translate(0, 0)">
      <rect width="64" height="64" rx="18" fill="url(#accentGrad)" filter="url(#shadow)" />
      <text x="32" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">🥗</text>
      
      <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
        NutriRecipe
      </text>

      <!-- Version Badge -->
      <rect x="330" y="16" width="70" height="28" rx="14" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1.5" />
      <text x="365" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">v1.1.0</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f1f5f9">
      Adatta qualsiasi video-ricetta social al tuo piano nutrizionale personale.
    </text>

    <!-- Description -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Incolla un link da TikTok o Instagram: l'AI di OpenAI GPT-4o calibra al grammo dosi e macro,
    </text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      bilancia più fonti della stessa categoria (50/50) e inserisce le quantità direttamente nei passaggi.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 215)">
      <!-- Badge 1: AI Engine -->
      <rect x="0" y="0" width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">🤖</text>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">OpenAI GPT-4o</text>

      <!-- Badge 2: Social Scraping -->
      <rect x="175" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="195" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">🎥</text>
      <text x="219" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">TikTok, IG &amp; YouTube</text>

      <!-- Badge 3: PWA iOS/Android -->
      <rect x="410" y="0" width="150" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="430" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">📱</text>
      <text x="454" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Installabile PWA</text>

      <!-- Badge 4: 100% Privacy -->
      <rect x="575" y="0" width="145" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <text x="595" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">🔒</text>
      <text x="619" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">100% Locale</text>
    </g>
  </g>

  <!-- Illustration on Right (Mini Device preview) -->
  <g transform="translate(860, 45)" filter="url(#shadow)">
    <!-- Phone outline -->
    <rect width="250" height="330" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <rect x="8" y="8" width="234" height="314" rx="28" fill="#f8fafc" />
    <!-- Dynamic island -->
    <rect x="85" y="16" width="80" height="18" rx="9" fill="#0f172a" />
    <!-- App UI Mockup inside -->
    <rect x="20" y="46" width="210" height="42" rx="12" fill="#10b981" />
    <text x="32" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">☀️🌙 Pranzo e Cena</text>

    <!-- Recipe Card Mockup -->
    <rect x="20" y="98" width="210" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect x="30" y="108" width="40" height="40" rx="10" fill="#d1fae5" />
    <text x="50" y="133" font-family="sans-serif" font-size="20" text-anchor="middle">🥞</text>
    <text x="78" y="123" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Pancake Salati</text>
    <text x="78" y="140" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">320 kcal • 28g P</text>
    <text x="30" y="172" font-family="sans-serif" font-size="9.5" fill="#64748b">Feta (25g) + Uova (50g) ✓</text>

    <!-- Step preview -->
    <rect x="20" y="196" width="210" height="74" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="30" y="214" font-family="sans-serif" font-size="10" font-weight="700" fill="#065f46">Passaggio 1 con dosi:</text>
    <text x="30" y="232" font-family="sans-serif" font-size="9" fill="#047857">"Unire le zucchine (200g)</text>
    <text x="30" y="247" font-family="sans-serif" font-size="9" fill="#047857">e aggiungere la feta (25g)..."</text>

    <!-- Bottom Nav mockup -->
    <rect x="20" y="280" width="210" height="30" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <text x="45" y="300" font-family="sans-serif" font-size="13">📚</text>
    <text x="90" y="300" font-family="sans-serif" font-size="13">➕</text>
    <text x="135" y="300" font-family="sans-serif" font-size="13">📅</text>
    <text x="180" y="300" font-family="sans-serif" font-size="13">🛒</text>
  </g>
</svg>